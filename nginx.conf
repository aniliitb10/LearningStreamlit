worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # HTTPS Configuration for Streamlit
 server {
    listen 8443 ssl;
    server_name localhost;  # Replace with your hostname or IP if applicable

    # SSL certificate files
    ssl_certificate /Users/anilkumar/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /Users/anilkumar/ssl/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Route for Streamlit app
    location /streamlit/ {
        proxy_pass http://127.0.0.1:8501/;  # Forward to Streamlit server
        proxy_redirect off;  # Disable any redirection surprises

        # Correct paths so Streamlit responds properly
        rewrite ^/streamlit(/.*)$ $1 break;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Streamlit (required for live interactions)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # Route for Spring Boot API
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}